name: CI

on:
  pull_request:
  push:
    tags:
      - '**'

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Run tests
        run: go test -race -count=1 ./...

  build:
    name: Build Linux ${{ matrix.arch }}
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            goarm: ''
          - arch: arm32
            goarch: arm
            goarm: '7'
          - arch: arm64
            goarch: arm64
            goarm: ''
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Build and package binary
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          VERSION: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o dist/mystvpn ./cmd/mystvpn
          tar -czf "dist/mystvpn-linux-${ARCH}.tar.gz" -C dist mystvpn
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mystvpn-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
