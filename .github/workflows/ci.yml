name: CI

on:
  pull_request:
  push:
    tags:
      - '**'

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Run tests
        run: go test -race -count=1 ./...
      - name: Check installer
        run: |
          bash -n install.sh
          shellcheck install.sh
          python3 test/install_test.py
      - name: Check Debian packaging
        run: |
          bash -n scripts/package-deb.sh
          shellcheck scripts/package-deb.sh
          python3 test/package_deb_test.py

  build:
    name: Build Linux ${{ matrix.arch }}
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            debarch: amd64
            goarch: amd64
            goarm: ''
          - arch: arm32
            debarch: armhf
            goarch: arm
            goarm: '7'
          - arch: arm64
            debarch: arm64
            goarch: arm64
            goarm: ''
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Build and package binary
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          VERSION: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o dist/mystvpn ./cmd/mystvpn
          tar -czf "dist/mystvpn-linux-${ARCH}.tar.gz" -C dist mystvpn
          (cd dist && sha256sum "mystvpn-linux-${ARCH}.tar.gz" > "mystvpn-linux-${ARCH}.tar.gz.sha256")
      - name: Build Debian package
        env:
          VERSION: ${{ github.ref_name }}
          DEBARCH: ${{ matrix.debarch }}
        run: bash scripts/package-deb.sh dist/mystvpn "$VERSION" "$DEBARCH" dist
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: mystvpn-linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz*
            dist/*.deb*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mystvpn-linux-*
          merge-multiple: true
          path: dist
      - name: Publish packages and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false
